# Insert the following location within the kineticaxisdigital.com HTTPS server block.
# DO NOT expose the contact-api/ source folder through Nginx's document root.
location = /api/events {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:4319/api/events;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    client_max_body_size 4k;
}

location = /api/leads {
    auth_basic "Kinetic Axis Growth";
    auth_basic_user_file /etc/kineticaxis/growth.htpasswd;
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:4319/api/leads;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    client_max_body_size 8k;
}

location = /api/growth-summary {
    auth_basic "Kinetic Axis Growth";
    auth_basic_user_file /etc/kineticaxis/growth.htpasswd;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:4319/api/growth-summary;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}

location = /api/contact {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:4319/api/contact;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
}

location = /api/estimate-email {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:4319/api/estimate-email;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    client_max_body_size 8k;
}
