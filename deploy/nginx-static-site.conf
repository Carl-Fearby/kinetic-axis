# Kinetic Axis — production Nginx site config.
# Keep this file byte-identical to the live copy at
# /etc/nginx/sites-available/kineticaxisdigital; edit both together.

# All HTTP traffic -> primary HTTPS .com
server {
    listen 80;
    listen [::]:80;

    server_name kineticaxisdigital.com www.kineticaxisdigital.com kineticaxisdigital.co.uk www.kineticaxisdigital.co.uk;

    return 301 https://kineticaxisdigital.com$request_uri;
}

# Primary website
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name kineticaxisdigital.com;

    root /var/www/kineticaxisdigital;
    index index.html;

    # Performance: gzip is enabled globally in nginx.conf but its gzip_types
    # block is commented out, so only text/html was actually compressed.
    # Measured on the homepage export: HTML 130 KB -> 19 KB, JS 633 KB -> 193 KB.
    # NOTE: if the enclosing server/http block already sets `gzip on;`, delete
    # this line — a duplicate gzip directive fails `nginx -t`.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml+rss application/rss+xml
               image/svg+xml application/manifest+json application/ld+json;

    ssl_certificate /etc/letsencrypt/live/kineticaxisdigital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kineticaxisdigital.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # NOTE: nginx drops add_header directives inherited from the enclosing
    # server block as soon as a location declares its own. If this server block
    # ever gains security headers (HSTS, X-Frame-Options, ...), repeat them
    # inside every location below that sets a Cache-Control header.

    # Serve the homepage directly. This prevents Nginx's index directive from
    # internally redirecting / to /index.html and triggering the legacy redirect.
    # HTML is replaced wholesale on every deploy: always revalidate it. Without
    # an explicit header Nginx falls back to heuristic caching, which can serve
    # stale markup for an unpredictable period.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Internal dashboards. The static pages and their data APIs share the same
    # server-side credentials file; credentials are never shipped in the web bundle.
    location ^~ /admin/growth {
        auth_basic "Kinetic Axis Growth";
        auth_basic_user_file /etc/kineticaxis/growth.htpasswd;
        try_files $uri $uri.html /admin/growth.html =404;
    }
    location ^~ /admin/leads {
        auth_basic "Kinetic Axis Growth";
        auth_basic_user_file /etc/kineticaxis/growth.htpasswd;
        try_files $uri $uri.html /admin/leads.html =404;
    }

    # Hashed build output never changes under the same URL: cache for a year.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Named (unhashed) assets and per-page CSS are replaced on deploy, so they
    # revalidate instead of pinning a stale copy.
    location = /assets/advert-captions.vtt {
        default_type text/vtt;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }
    location ^~ /page-css/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # SEO: extensionless URLs are canonical. Collapse .html paths and
    # trailing-slash variants onto them so crawlers see one URL per page.
    location = /index.html { return 301 /$is_args$args; }
    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }
    location ~ ^(.+)/$ { return 301 $1$is_args$args; }
    # Next static export still places its files at /work.html and
    # /projects/pace.html; $uri.html first serves clean public requests for them.
    location / {
        try_files $uri.html $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /api/events {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:4319/api/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        client_max_body_size 4k;
    }
    location = /api/growth-summary {
    auth_basic "Kinetic Axis Growth";
    auth_basic_user_file /etc/kineticaxis/growth.htpasswd;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:4319/api/growth-summary;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /api/leads {
        auth_basic "Kinetic Axis Growth";
        auth_basic_user_file /etc/kineticaxis/growth.htpasswd;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:4319/api/leads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        client_max_body_size 8k;
    }
    location = /api/contact {
	proxy_pass http://127.0.0.1:4319/api/contact;
	proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;

        client_max_body_size 32k;
    }
    location = /api/estimate-email {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:4319/api/estimate-email;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        client_max_body_size 8k;
    }

}

# www.com -> primary .com
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.kineticaxisdigital.com;

    ssl_certificate /etc/letsencrypt/live/kineticaxisdigital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kineticaxisdigital.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kineticaxisdigital.com$request_uri;
}

# .co.uk -> primary .com
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name kineticaxisdigital.co.uk www.kineticaxisdigital.co.uk;

    ssl_certificate /etc/letsencrypt/live/kineticaxisdigital.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kineticaxisdigital.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://kineticaxisdigital.com$request_uri;
}
